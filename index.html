<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base Mini-App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#0052FF"/>
          <path d="M14 6C9.58 6 6 9.58 6 14s3.58 8 8 8c4.01 0 7.33-2.97 7.91-6.82H14v-2.36h10c.06.37.09.75.09 1.14C24.09 19.71 19.56 24 14 24 8.48 24 4 19.52 4 14S8.48 4 14 4c2.72 0 5.19 1.04 7.04 2.74l-1.68 1.68A7.93 7.93 0 0 0 14 6z" fill="white"/>
        </svg>
        <span>Base Mini-App</span>
      </div>
      <div class="header-right">
        <button class="btn-theme" id="btnTheme" title="Toggle theme">☀</button>
        <div class="network-badge" id="networkBadge">—</div>
      </div>
    </header>

    <main class="main">

      <!-- Connect section -->
      <section class="card" id="connectSection">
        <h2>Connect Wallet</h2>
        <p class="hint">Connect MetaMask to Base Mainnet or Base Sepolia to get started.</p>
        <div class="btn-group">
          <button class="btn btn-primary" id="btnConnectMainnet">
            Connect — Base Mainnet
          </button>
          <button class="btn btn-secondary" id="btnConnectSepolia">
            Connect — Base Sepolia
          </button>
        </div>
      </section>

      <!-- Wallet info (hidden until connected) -->
      <section class="card hidden" id="walletSection">
        <h2>Your Wallet</h2>
        <div class="field">
          <label>Address</label>
          <div class="addr-row">
            <div class="value mono" id="walletAddress">—</div>
            <button class="btn-copy" id="btnCopy" title="Copy address">⎘</button>
          </div>
        </div>
        <div class="field">
          <label>ETH Balance</label>
          <div class="value" id="walletBalance">—</div>
        </div>
        <button class="btn btn-ghost" id="btnRefresh">↻ Refresh</button>
        <button class="btn btn-ghost btn-disconnect" id="btnDisconnect">Disconnect</button>
      </section>

      <!-- Send ETH (hidden until connected) -->
      <section class="card hidden" id="sendSection">
        <h2>Send ETH</h2>
        <div class="form-group">
          <label for="toAddress">Recipient Address</label>
          <input id="toAddress" type="text" placeholder="0x…" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="sendAmount">Amount (ETH)</label>
          <input id="sendAmount" type="number" placeholder="0.001" min="0" step="0.0001" />
        </div>
        <div class="gas-estimate hidden" id="gasEstimate">
          <span class="gas-label">Estimated gas</span>
          <span id="gasEstimateValue">—</span>
        </div>
        <button class="btn btn-primary" id="btnSend">Send ETH</button>
        <div class="tx-status hidden" id="txStatus"></div>
      </section>

      <!-- Network stats (hidden until connected) -->
      <section class="card hidden" id="statsSection">
        <h2>Network</h2>
        <div class="stats-grid">
          <div class="stat">
            <span class="stat-label">Block</span>
            <span class="stat-value" id="statBlock">—</span>
          </div>
          <div class="stat">
            <span class="stat-label">Base fee</span>
            <span class="stat-value" id="statBaseFee">—</span>
          </div>
          <div class="stat">
            <span class="stat-label">Gas price</span>
            <span class="stat-value" id="statGasPrice">—</span>
          </div>
          <div class="stat">
            <span class="stat-label">Chain ID</span>
            <span class="stat-value" id="statChainId">—</span>
          </div>
        </div>
        <button class="btn btn-ghost" id="btnRefreshStats">↻ Refresh stats</button>
      </section>

      <!-- Transaction history -->
      <section class="card hidden" id="historySection">
        <div class="section-header">
          <h2>Sent Transactions</h2>
          <button class="btn btn-ghost btn-sm" id="btnClearHistory">Clear</button>
        </div>
        <ul class="tx-list" id="txList"></ul>
      </section>

      <!-- Activity log -->
      <section class="card hidden" id="logSection">
        <h2>Activity</h2>
        <ul class="log" id="activityLog"></ul>
      </section>

    </main>

    <footer class="footer">
      Built on <a href="https://base.org" target="_blank" rel="noopener">Base</a> ·
      <a href="https://github.com/esazonova/base-miniapp" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
